name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Test & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run tests and build jar
        run: mvn -B verify

      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-jar
          path: target/portfolio-*.jar

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t portfolio:${{ github.sha }} .
