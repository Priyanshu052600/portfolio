spring.application.name=portfolio
# Hosting platforms (Render, Railway, Fly.io) inject PORT; default to 8080 locally.
server.port=${PORT:8080}
server.compression.enabled=true
# All site content lives in portfolio.yml so it can be edited without touching code.
spring.config.import=classpath:portfolio.yml
# Keep session IDs out of URLs (flash attributes still work via the cookie).
server.servlet.session.tracking-modes=cookie
# ---------------------------------------------------------------------------
# Contact-form email. All messages go to CONTACT_TO_EMAIL. The sender is chosen
# automatically:
#   1. Gmail SMTP if MAIL_USERNAME + MAIL_PASSWORD (a Gmail app password) are set.
#      Works locally and on paid hosts; Render's FREE plan blocks SMTP ports.
#   2. Resend (https://resend.com) over HTTPS if RESEND_API_KEY is set.
#   3. Otherwise messages are only logged.
# Secrets come from environment variables only; never put them in this file.
# ---------------------------------------------------------------------------
contact.mail.to=${CONTACT_TO_EMAIL:priyanshugupta78600@gmail.com}
contact.mail.gmail-username=${MAIL_USERNAME:}
contact.mail.gmail-password=${MAIL_PASSWORD:}
contact.mail.resend-api-key=${RESEND_API_KEY:}
# Without a custom domain, Resend only delivers to the email you signed up with.
contact.mail.resend-from=${CONTACT_FROM_EMAIL:Portfolio Contact <onboarding@resend.dev>}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Fail fast (e.g. when a host blocks SMTP) instead of hanging the visitor's request.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
