# Render Blueprint: deploys the Dockerfile as a free web service and
# redeploys automatically on every push to main.
services:
  - type: web
    name: priyanshu-portfolio
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /
    envVars:
      # Secret: Render asks for this value in the dashboard; it is never stored in Git.
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        value: priyanshugupta78600@gmail.com
